<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Deskwork</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0f172a;color:#e2e8f0;font-family:sans-serif}
#login{padding:22px;max-width:480px;margin:auto}
h1{color:#38bdf8;margin:6px 0 4px}
p.sub{margin:0 0 10px;color:#94a3b8;font-size:14px}
label{display:block;margin:14px 0 4px;font-size:13px;color:#94a3b8}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #475569;background:#1e293b;color:#fff;font-size:16px}
#go{margin-top:18px;width:100%;padding:14px;border:0;border-radius:8px;background:#0284c7;color:#fff;font-size:17px}
#msg{margin-top:12px;min-height:20px;font-size:14px;color:#fbbf24}
#screen{position:fixed;inset:0;background:#000;touch-action:none}
#vid{width:100%;height:100%;object-fit:contain;pointer-events:none}
#bar{position:fixed;top:0;left:0;right:0;display:flex;gap:6px;padding:6px;overflow-x:auto;background:#0f172acc;z-index:5}
#bar button{flex:0 0 auto;padding:8px 12px;border:0;border-radius:6px;background:#334155;color:#fff;font-size:14px}
#bar button.on{background:#0284c7}
#bar button.x{background:#dc2626}
#kb{position:fixed;bottom:0;left:0;width:1px;height:1px;opacity:0;border:0;padding:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="login">
  <h1>Deskwork</h1>
  <p class="sub">Control your office PC from your phone</p>
  <label>Server address</label>
  <input id="server" placeholder="wss://your-name.onrender.com" autocapitalize="none" autocorrect="off">
  <label>Office PC ID</label>
  <input id="id" inputmode="numeric" placeholder="123456789">
  <label>Password</label>
  <input id="pass" type="password">
  <button id="go">Connect</button>
  <div id="msg"></div>
</div>

<div id="screen" hidden>
  <video id="vid" autoplay playsinline muted></video>
  <div id="bar">
    <button id="b_kb">Keyboard</button>
    <button id="b_esc">Esc</button>
    <button id="b_tab">Tab</button>
    <button id="b_ctrl">Ctrl</button>
    <button id="b_alt">Alt</button>
    <button id="b_win">Win</button>
    <button id="b_del">Del</button>
    <button id="b_left">&larr;</button>
    <button id="b_up">&uarr;</button>
    <button id="b_down">&darr;</button>
    <button id="b_right">&rarr;</button>
    <button id="b_close" class="x">Disconnect</button>
  </div>
</div>
<textarea id="kb" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"></textarea>

<script>
var $ = function (id) { return document.getElementById(id); };
var ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
var ls = {
  get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
var ws = null, pc = null, dc = null, connected = false;

$('server').value = ls.get('server');
$('id').value = ls.get('id');
function say(t) { $('msg').textContent = t; }
function sig(d) { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'signal', data: d })); }
function snd(m) { if (dc && dc.readyState === 'open') dc.send(JSON.stringify(m)); }

/* ---------- connection ---------- */
function disconnect(msg) {
  connected = false;
  if (pc) { pc.close(); pc = null; }
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  dc = null;
  $('vid').srcObject = null;
  $('screen').hidden = true;
  $('login').hidden = false;
  $('kb').blur();
  if (msg) say(msg);
}
window.onBack = function () { if (connected) disconnect(''); else App.exit(); };

function makePC() {
  pc = new RTCPeerConnection(ICE);
  pc.ontrack = function (e) {
    $('vid').srcObject = e.streams[0];
    $('login').hidden = true;
    $('screen').hidden = false;
    connected = true;
  };
  pc.ondatachannel = function (e) {
    dc = e.channel;
    dc.onopen = function () { snd({ t: 'm', x: cur.x, y: cur.y }); };
  };
  pc.onicecandidate = function (e) { if (e.candidate) sig({ c: e.candidate }); };
  pc.onconnectionstatechange = function () {
    if (pc && (pc.connectionState === 'failed' || pc.connectionState === 'disconnected')) disconnect('Connection lost');
  };
}

async function onSignal(d) {
  if (d.sdp) {
    if (!pc) makePC();
    await pc.setRemoteDescription(d.sdp);
    if (d.sdp.type === 'offer') {
      var a = await pc.createAnswer();
      await pc.setLocalDescription(a);
      sig({ sdp: pc.localDescription });
    }
  } else if (d.c && pc) await pc.addIceCandidate(d.c);
}

$('go').onclick = function () {
  var url = $('server').value.trim(), id = $('id').value.replace(/\s/g, ''), pass = $('pass').value;
  if (!url || !id || !pass) return say('Enter server, ID and password');
  ls.set('server', url); ls.set('id', id);
  say('Connecting...');
  ws = new WebSocket(url);
  ws.onopen = function () { ws.send(JSON.stringify({ type: 'join', id: id, pass: pass })); };
  ws.onmessage = async function (e) {
    var m = JSON.parse(e.data);
    if (m.type === 'joined') say('Waiting for the screen...');
    else if (m.type === 'error') disconnect(m.message);
    else if (m.type === 'signal') await onSignal(m.data);
    else if (m.type === 'host-left') disconnect('The office PC has stopped sharing');
  };
  ws.onerror = function () { say('Could not reach the server'); };
  ws.onclose = function () { if (ws) disconnect('Disconnected from server'); };
};

/* ---------- keyboard ---------- */
var mods = { ctrl: false, alt: false, win: false };
var MV = { ctrl: 162, alt: 164, win: 91 };
function tap(vk, shift) {
  var act = Object.keys(mods).filter(function (k) { return mods[k]; });
  act.forEach(function (k) { snd({ t: 'k', vk: MV[k], d: 1 }); });
  if (shift) snd({ t: 'k', vk: 160, d: 1 });
  snd({ t: 'k', vk: vk, d: 1 });
  snd({ t: 'k', vk: vk, d: 0 });
  if (shift) snd({ t: 'k', vk: 160, d: 0 });
  act.forEach(function (k) { snd({ t: 'k', vk: MV[k], d: 0 }); mods[k] = false; $('b_' + k).classList.remove('on'); });
}
var SH = { '!': 49, '@': 50, '#': 51, '$': 52, '%': 53, '^': 54, '&': 55, '*': 56, '(': 57, ')': 48, '<': 188, '>': 190, '?': 191, '_': 189, '+': 187, ':': 186, '"': 222, '{': 219, '}': 221, '|': 220, '~': 192 };
var PL = { ',': 188, '.': 190, '/': 191, '-': 189, '=': 187, ';': 186, "'": 222, '[': 219, ']': 221, '\\': 220, '`': 192, ' ': 32 };
function typeChar(c) {
  if (/[a-z]/.test(c)) tap(c.toUpperCase().charCodeAt(0), false);
  else if (/[A-Z]/.test(c)) tap(c.charCodeAt(0), true);
  else if (/[0-9]/.test(c)) tap(c.charCodeAt(0), false);
  else if (SH[c]) tap(SH[c], true);
  else if (PL[c]) tap(PL[c], false);
}
var kb = $('kb');
function resetKb() { kb.value = ' '; }
kb.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { tap(13); e.preventDefault(); }
  else if (e.key === 'Backspace') { tap(8); e.preventDefault(); }
});
kb.addEventListener('compositionend', function (e) { Array.from(e.data || '').forEach(typeChar); resetKb(); });
kb.addEventListener('input', function (e) {
  if (e.isComposing) return;
  if (e.inputType === 'insertText' && e.data) Array.from(e.data).forEach(typeChar);
  else if (e.inputType === 'deleteContentBackward') tap(8);
  else if (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph') tap(13);
  resetKb();
});

function bind(id, fn) {
  var b = $(id);
  b.addEventListener('touchstart', function (e) { e.preventDefault(); fn(); }, { passive: false });
  b.addEventListener('click', fn);
}
bind('b_kb', function () { if (document.activeElement === kb) kb.blur(); else { resetKb(); kb.focus(); } });
bind('b_esc', function () { tap(27); });
bind('b_tab', function () { tap(9); });
bind('b_del', function () { tap(46); });
bind('b_left', function () { tap(37); });
bind('b_up', function () { tap(38); });
bind('b_down', function () { tap(40); });
bind('b_right', function () { tap(39); });
['ctrl', 'alt', 'win'].forEach(function (k) {
  bind('b_' + k, function () { mods[k] = !mods[k]; $('b_' + k).classList.toggle('on', mods[k]); });
});
bind('b_close', function () { disconnect(''); });

/* ---------- touchpad gestures ----------
   1 finger drag = move cursor | tap = left click | double-tap and hold = drag
   2 finger drag = scroll | 2 finger tap = right click */
var cur = { x: 0.5, y: 0.5 }, GAIN = 1.6;
var scr = $('screen'), vid = $('vid');
var last = null, t0 = 0, moved = 0, lastTapEnd = 0, drag = false, two = null;
function clamp(v) { return Math.min(1, Math.max(0, v)); }
function disp() {
  var r = vid.getBoundingClientRect(), vw = vid.videoWidth || 1, vh = vid.videoHeight || 1;
  var s = Math.min(r.width / vw, r.height / vh);
  return { w: vw * s, h: vh * s };
}
function avgY(e) { return (e.touches[0].clientY + e.touches[1].clientY) / 2; }

scr.addEventListener('touchstart', function (e) {
  if (e.target.closest('#bar')) return;
  e.preventDefault();
  if (e.touches.length === 1) {
    last = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    t0 = Date.now(); moved = 0;
    if (Date.now() - lastTapEnd < 300) { drag = true; snd({ t: 'b', f: 2 }); }
  } else if (e.touches.length === 2) {
    last = null;
    two = { y: avgY(e), t: Date.now(), moved: 0 };
  }
}, { passive: false });

scr.addEventListener('touchmove', function (e) {
  if (e.target.closest('#bar')) return;
  e.preventDefault();
  if (e.touches.length === 1 && last) {
    var t = e.touches[0], dx = t.clientX - last.x, dy = t.clientY - last.y, d = disp();
    last = { x: t.clientX, y: t.clientY };
    moved += Math.abs(dx) + Math.abs(dy);
    cur.x = clamp(cur.x + dx / d.w * GAIN);
    cur.y = clamp(cur.y + dy / d.h * GAIN);
    snd({ t: 'm', x: cur.x, y: cur.y });
  } else if (e.touches.length === 2 && two) {
    var y = avgY(e), dy2 = y - two.y;
    two.y = y; two.moved += Math.abs(dy2);
    if (dy2) snd({ t: 'w', d: Math.round(dy2 * 4) });
  }
}, { passive: false });

scr.addEventListener('touchend', function (e) {
  if (e.target.closest('#bar')) return;
  e.preventDefault();
  if (two) {
    if (e.touches.length === 0) {
      if (Date.now() - two.t < 300 && two.moved < 8) { snd({ t: 'b', f: 8 }); snd({ t: 'b', f: 16 }); }
      two = null;
    }
    return;
  }
  if (e.touches.length === 0) {
    if (drag) { snd({ t: 'b', f: 4 }); drag = false; }
    else if (Date.now() - t0 < 250 && moved < 10) { snd({ t: 'b', f: 2 }); snd({ t: 'b', f: 4 }); lastTapEnd = Date.now(); }
    last = null;
  }
}, { passive: false });
</script>
</body>
</html>
